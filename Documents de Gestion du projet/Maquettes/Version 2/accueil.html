<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
    <!-- Fond blanc -->
    <rect width="800" height="1200" fill="#FFFFFF" />
    
    <!-- Header -->
    <rect width="800" height="80" fill="#1E90FF" />
    <text x="40" y="50" font-family="Calibri Light" font-size="24" fill="white">AFHE</text>
    
    <!-- Menu de navigation -->
    <text x="500" y="50" font-family="Calibri Light" font-size="16" fill="white">Accueil</text>
    <text x="570" y="50" font-family="Calibri Light" font-size="16" fill="white">Activités &amp; Projets</text>
    <text x="700" y="50" font-family="Calibri Light" font-size="16" fill="white">Contact</text>
    
    <!-- Bannière principale avec slider -->
    <rect x="0" y="80" width="800" height="400" fill="#F0F8FF" />
    <rect x="100" y="130" width="600" height="300" fill="#DDDDDD" />
    <text x="270" y="280" font-family="Calibri Light" font-size="24" fill="#666666">[Slider d'images]</text>
    
    <!-- Navigation du slider -->
    <circle cx="380" cy="460" r="8" fill="#1E90FF" />
    <circle cx="400" cy="460" r="6" fill="#CCCCCC" />
    <circle cx="420" cy="460" r="6" fill="#CCCCCC" />
    
    <!-- Présentation de l'association -->
    <text x="100" y="520" font-family="Calibri Light" font-size="28" font-weight="bold" fill="#1E90FF">Bienvenue à l'AFHE</text>
    <line x1="100" y1="530" x2="350" y2="530" stroke="#FF69B4" stroke-width="3" />
    
    <rect x="100" y="550" width="600" height="120" fill="white" />
    <text x="100" y="570" font-family="Calibri Light" font-size="16" fill="#333333">
      <tspan x="100" y="570">L'Association des Femmes Handicapées pour l'Entrepreneuriat (AFHE) est une</tspan>
      <tspan x="100" y="595">organisation à but non lucratif qui vise à promouvoir l'entrepreneuriat féminin</tspan>
      <tspan x="100" y="620">handi comme levier de croissance économique.</tspan>
      <tspan x="100" y="645">Notre vision est de positionner la femme handicapée comme actrice de développement</tspan>
      <tspan x="100" y="670">à l'horizon 2035.</tspan>
    </text>
    
    <!-- Mot de la présidente -->
    <text x="100" y="720" font-family="Calibri Light" font-size="24" font-weight="bold" fill="#1E90FF">Mot de la Présidente</text>
    <line x1="100" y1="730" x2="300" y2="730" stroke="#FF69B4" stroke-width="3" />
    
    <circle cx="170" cy="800" r="70" fill="#DDDDDD" />
    <text x="170" y="800" font-family="Calibri Light" font-size="14" fill="#666666" text-anchor="middle">Photo</text>
    
    <rect x="280" y="750" width="420" height="120" fill="white" />
    <text x="280" y="770" font-family="Calibri Light" font-size="16" fill="#333333">
      <tspan x="280" y="770">Message de Mme SOUT Marie Florence</tspan>
      <tspan x="280" y="795">Présidente de l'AFHE</tspan>
      <tspan x="280" y="830">"Citation inspirante sur l'entrepreneuriat</tspan>
      <tspan x="280" y="855">féminin handi et le développement..."</tspan>
    </text>
    
    <!-- Nos valeurs -->
    <text x="100" y="920" font-family="Calibri Light" font-size="24" font-weight="bold" fill="#1E90FF">Nos Valeurs</text>
    <line x1="100" y1="930" x2="200" y2="930" stroke="#FF69B4" stroke-width="3" />
    
    <!-- Valeurs en cercles -->
    <circle cx="170" cy="980" r="40" fill="#1E90FF" />
    <text x="170" y="985" font-family="Calibri Light" font-size="12" fill="white" text-anchor="middle">Autodiscipline</text>
    
    <circle cx="270" cy="980" r="40" fill="#1E90FF" />
    <text x="270" y="985" font-family="Calibri Light" font-size="12" fill="white" text-anchor="middle">Adaptabilité</text>
    
    <circle cx="370" cy="980" r="40" fill="#1E90FF" />
    <text x="370" y="985" font-family="Calibri Light" font-size="12" fill="white" text-anchor="middle">Compétence</text>
    
    <circle cx="470" cy="980" r="40" fill="#1E90FF" />
    <text x="470" y="985" font-family="Calibri Light" font-size="12" fill="white" text-anchor="middle">Autonomie</text>
    
    <circle cx="570" cy="980" r="40" fill="#1E90FF" />
    <text x="570" y="985" font-family="Calibri Light" font-size="12" fill="white" text-anchor="middle">Épanouissement</text>
    
    <!-- Appel à l'action -->
    <rect x="100" y="1050" width="600" height="60" rx="30" fill="#FF69B4" />
    <text x="400" y="1085" font-family="Calibri Light" font-size="20" fill="white" text-anchor="middle">Faire un don pour soutenir nos projets inclusifs</text>
    
    <!-- Footer -->
    <rect x="0" y="1150" width="800" height="50" fill="#1E90FF" />
    <text x="400" y="1180" font-family="Calibri Light" font-size="14" fill="white" text-anchor="middle">© 2025 AFHE - Association des Femmes Handicapées pour l'Entrepreneuriat</text>
    
    <!-- Bouton Admin Login -->
    <rect x="690" y="1160" width="100" height="30" rx="5" fill="#FFFFFF" fill-opacity="0.2" />
    <text x="740" y="1180" font-family="Calibri Light" font-size="12" fill="white" text-anchor="middle">Admin Login</text>
  </svg>
